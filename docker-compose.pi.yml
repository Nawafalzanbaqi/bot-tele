# ---------------------------------------------------------------------------
# MediaHub on a Raspberry Pi that is already running other things.
#
#   telegram   the bot: long-polls, probes, downloads, delivers
#   api        HTTP surface, for the web interface that comes later
#   botapi     optional self-hosted Bot API server, raising 50 MB to 2 GB
#
#   vpn        optional egress for the download engine, when the network the
#              device sits on refuses to carry some of its traffic
#
# Run:  docker compose -f docker-compose.pi.yml up -d
# With the local Bot API server:
#       docker compose -f docker-compose.pi.yml --profile localapi up -d
# With both:
#       docker compose -f docker-compose.pi.yml --profile localapi --profile vpn up -d
#
# Three properties of this file exist because the device is shared:
#
# * **No database service.** SQLite is the system of record (ADR-0006). A
#   database server would cost 200 MB of a 4 GB board to store a few thousand
#   rows.
# * **Every port is deliberate and none is a default.** The host's own
#   services hold 53/80 (Pi-hole), 3001 (uptime-kuma) and 2283 (Immich). The
#   API is published on 8090 and bound to loopback.
# * **Memory limits on every service.** An unbounded download or upload on a
#   4 GB board is not this project failing, it is the OOM killer choosing a
#   victim among someone else's containers.
# ---------------------------------------------------------------------------
name: mediahub

x-common: &common
  image: mediahub/app:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
  environment: &common-env
    MEDIAHUB_ENVIRONMENT: production
    MEDIAHUB_DATABASE__BACKEND: sqlite
    MEDIAHUB_DATABASE__SQLITE_PATH: /data/mediahub.db
    MEDIAHUB_WORKSPACE__ROOT: /data/workspace
    MEDIAHUB_DOWNLOAD__ENABLED: "true"
    MEDIAHUB_LOGGING__JSON_FORMAT: "true"
  networks:
    - mediahub
  logging:
    # Without this, a chatty container fills the card it is running on. The
    # other projects on this host learn about it as "no space left on device".
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  telegram:
    <<: *common
    build:
      context: .
      target: runtime
      args:
        PYTHON_VERSION: "3.13"
    command: ["python", "-m", "mediahub.presentation.telegram"]
    environment:
      <<: *common-env
      MEDIAHUB_TELEGRAM__ENABLED: "true"
      # This process owns the workspace root and is the only thing writing to
      # it, so sweeping it at startup is correct here and would not be if the
      # API shared it.
      MEDIAHUB_WORKSPACE__PURGE_ON_START: "true"
      # Touched by the poll loop after every successful long-poll; the
      # healthcheck below watches its age. See TelegramSettings.heartbeat_file.
      MEDIAHUB_TELEGRAM__HEARTBEAT_FILE: /data/telegram-heartbeat
      # Hosts that needed the egress, kept across restarts and hand-editable
      # (one per line). On the host: the mediahub_data volume, egress-hosts.txt.
      MEDIAHUB_DOWNLOAD__EGRESS_HOSTS_FILE: /data/egress-hosts.txt
      # Third egress tier (ProtonVPN Free, service `vpn-proton` below). The
      # tier exists only when all three are set; the key comes from .env
      # (MEDIAHUB_DOWNLOAD__PROTON_CONTROL_KEY) and matches the roles file
      # mounted into vpn-proton. Leave the key unset to keep two tiers.
      MEDIAHUB_DOWNLOAD__PROTON_PROXY: http://vpn-proton:8888
      MEDIAHUB_DOWNLOAD__PROTON_CONTROL_URL: http://vpn-proton:8000
      # Country order is the setting's default (nl, pl, ro); override in .env as
      # MEDIAHUB_DOWNLOAD__PROTON_COUNTRIES=nl,pl,ro once the comma form is accepted.
    volumes:
      - data:/data
      # The cookie jar, and deliberately **writable**.
      #
      # Read-only looks safer and is worse. Sites rotate their cookies on every
      # request and the engine writes the rotated set back after each download,
      # which is what keeps a session alive without anybody touching it. Mount
      # this read-only and that renewal is silently discarded: the jar slowly
      # goes stale and a platform starts refusing again weeks later, for no
      # visible reason.
      #
      # The exposure is bounded and worth it: one process reads and writes this
      # file, it runs as a non-root user, and the file is 0600.
      - ./secrets:/secrets
      # The self-hosted Bot API server's data directory, read-only.
      #
      # In local mode that server does not serve an uploaded file over HTTP -
      # it writes the file to its own disk and `getFile` returns an absolute
      # path to it. Without this mount that path names a file this process
      # cannot open, and every upload fails on exactly the deployments that
      # went to the trouble of running their own server.
      #
      # Harmless when the `localapi` profile is not in use: the volume is then
      # simply empty.
      - botapi:/var/lib/telegram-bot-api:ro
    # The Bot API server writes its files 0640 into 0750 directories owned by
    # its own uid (101). Mounting the volume is therefore not enough - without
    # membership of that group this process cannot even traverse the directory,
    # the client library's "is this a local file?" check answers no, and it
    # falls back to an HTTP fetch that 404s.
    #
    # A supplementary group rather than running either container as the other's
    # user: it grants exactly the read this needs and changes nothing about how
    # the server runs or what it owns.
    group_add:
      - "101"
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # An upload is buffered in memory by the client library, so this
          # must exceed the largest artifact the destination will accept.
          memory: 1200M
    healthcheck:
      # The previous check opened the SQLite file from a fresh process, which
      # passes while the poll loop is dead or wedged. This one fails when the
      # loop has not completed a poll for 300 s (polls are <= 30 s apart; the
      # margin covers a slow probe still running inline on the loop).
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.stat('/data/telegram-heartbeat').st_mtime < 300 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  api:
    <<: *common
    command:
      - uvicorn
      - mediahub.presentation.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *common-env
      # The gateway sweeps the workspace; a second process doing so would
      # delete the leases of downloads that are currently running.
      MEDIAHUB_WORKSPACE__PURGE_ON_START: "false"
      MEDIAHUB_DOWNLOAD__ENABLED: "false"
      # This process serves HTTP; it does not run the bot. Saying so keeps a
      # missing or rotated bot token from stopping the API booting, which is
      # the role-scoped validation the architecture review asks for (20 4.20).
      MEDIAHUB_TELEGRAM__ENABLED: "false"
    ports:
      # Loopback only. Reach it from another machine over the SSH tunnel, or
      # put it behind the reverse proxy this host already has. Publishing to
      # 0.0.0.0 would expose an unauthenticated API to the whole LAN.
      - "127.0.0.1:8090:8000"
    volumes:
      - data:/data
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Opt-in: `--profile localapi`. Raises the upload ceiling from 50 MB to 2 GB.
  # Needs TELEGRAM_API_ID and TELEGRAM_API_HASH from https://my.telegram.org -
  # these identify the *application*, not the bot, and are not the bot token.
  botapi:
    # Pinned by digest (2026-09-28). `latest` moved under us without a review step; bump the
    # digest deliberately, alongside a rebuild, and record it in the commit message.
    image: aiogram/telegram-bot-api@sha256:6ab985144d46d024c723f4def72419d949b88ba97bf234dadf415051367a1b69
    restart: unless-stopped
    profiles: ["localapi"]
    environment:
      # Empty defaults rather than `:?` guards: Compose interpolates *every*
      # service in the file, including ones behind a profile that is not
      # active, so a required-variable guard here would stop the whole stack
      # from parsing for anyone not using the local API server. The image
      # itself refuses to start on an empty value, which is the right place
      # for that complaint.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi:/var/lib/telegram-bot-api
      # The workspace, read-only and **at the same path the gateway sees**.
      #
      # In local mode a file is delivered by handing this server its path
      # instead of its bytes, which is what keeps a 2 GB upload from being 2 GB
      # of resident memory in the gateway. The paths must line up exactly: an
      # absolute path is meaningless to a process that mounted it elsewhere.
      - data:/data:ro
    networks:
      - mediahub
    deploy:
      resources:
        limits:
          memory: 600M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in: `--profile vpn`. An egress for the download engine only.
  #
  # **Only the engine's traffic goes through it, not the container's.** That is
  # the whole design, and the alternative is worse in three ways: routing the
  # gateway through a tunnel would send every Telegram upload through it as
  # well - slower, and metered on most subscriptions - and `network_mode:
  # service:vpn` would take the gateway off this network entirely, so it could
  # no longer resolve `botapi`, which is the one thing that makes 2 GB uploads
  # possible. Pointing MEDIAHUB_DOWNLOAD__PROXY at this service instead keeps
  # delivery on the direct path and moves only the fetching.
  #
  # Gluetun rather than a hand-rolled WireGuard container: it speaks ~50
  # providers' native configuration, publishes arm64 images, and carries the
  # HTTP proxy this needs, so the wiring below does not change with provider.
  #
  # Set in .env:
  #   VPN_SERVICE_PROVIDER, VPN_TYPE, and the credentials your provider uses
  #   MEDIAHUB_DOWNLOAD__PROXY=http://vpn:8888
  #
  # The engine goes **direct first** and escalates: a fetch that is refused
  # in a way that names the exit address (403, geo-fence, reset, "your IP is
  # blocked", bot wall) is retried once through this proxy with a browser
  # fingerprint, and that host is then routed through it for the life of the
  # process (MEDIAHUB_DOWNLOAD__PROXY_HOSTS lists hosts that start here).
  # The kill switch is for that routed traffic: if the tunnel drops, the
  # proxy stops answering and those fetches fail. They never quietly fall
  # back to the direct route. Everything else was never in the tunnel.
  vpn:
    # Pinned by digest (2026-09-28, the build of 2026-07-31 that has run here since 08-02).
    image: qmcgaw/gluetun@sha256:988d9cb1982f688ce51f3511057b90c5c8d01889db60a4d56e5230aebf1d3339
    restart: unless-stopped
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Empty defaults, for the same reason as `botapi` above: Compose
      # interpolates every service in the file, including inactive profiles.
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-custom}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      VPN_ENDPOINT_IP: ${VPN_ENDPOINT_IP:-}
      VPN_ENDPOINT_PORT: ${VPN_ENDPOINT_PORT:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      # Some paths cannot carry WireGuard's default 1420. The symptom is not a
      # tunnel that fails to come up but one that stalls on the first packet
      # larger than a handshake.
      WIREGUARD_MTU: ${WIREGUARD_MTU:-}
      # Only consulted when VPN_SERVICE_PROVIDER names a provider rather than
      # `custom`; harmless when it does not.
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-}
      # The tunnel's own resolver. Left to gluetun's default rather than copied
      # from the .conf: a DNS server reachable only inside the tunnel is a
      # reasonable thing for a config to name, and gluetun already runs one.
      DOT: ${VPN_DOT:-on}
      # The proxy the engine talks to. Listening on the container network only;
      # no port is published to the host.
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      TZ: ${TZ:-Asia/Riyadh}
    networks:
      - mediahub
    deploy:
      resources:
        limits:
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Third egress tier: ProtonVPN Free, through a second gluetun. Opt-in with
  # the same `vpn` profile. WARP (`vpn` above) stays exactly as it is; this one
  # is asked only when a site answers through WARP with "removed",
  # "geo-blocked" or "unavailable", and by `/vpn <country> <link>`.
  #
  # One container, not one per country: a free Proton account allows a single
  # connection, so the exit country is switched at run time through gluetun's
  # control server (PUT /v1/vpn/settings), one country at a time, under a lock
  # in the bot. The control server is API-key protected by the roles file
  # mounted below; the same key sits in .env as
  # MEDIAHUB_DOWNLOAD__PROTON_CONTROL_KEY. Credentials are the account's
  # OpenVPN user/password in ./secrets/proton.env (0600, git-ignored).
  #
  # Kill switch, same as WARP: gluetun's own firewall inside the container,
  # and the proxy only answers while the tunnel is up. A routed fetch that
  # loses the tunnel fails; nothing falls back to the direct route.
  vpn-proton:
    image: qmcgaw/gluetun@sha256:988d9cb1982f688ce51f3511057b90c5c8d01889db60a4d56e5230aebf1d3339
    restart: unless-stopped
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ./secrets/proton.env
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      FREE_ONLY: "on"
      # The starting country; the bot moves it (Netherlands -> Poland -> Romania).
      SERVER_COUNTRIES: ${PROTON_COUNTRY:-Netherlands}
      DOT: "on"
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
      # Country in the public-IP lookup is what the bot waits for after a switch.
      PUBLICIP_ENABLED: "on"
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - ./secrets/gluetun-proton-auth.toml:/gluetun/auth/config.toml:ro
    networks:
      - mediahub
    deploy:
      resources:
        limits:
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # One volume holding the database and the scratch space. They are together
  # because the Pi has one NVMe; on a machine with two devices the workspace
  # belongs on the other one, so the write-heavy throwaway load stays away from
  # the only irreplaceable file.
  data:
  botapi:

networks:
  mediahub:
    driver: bridge
